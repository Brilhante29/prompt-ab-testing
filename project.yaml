id: 10
name: prompt-ab-testing
program:
  id: ai-evaluation-retrieval
  narrative_fit: Compares prompt outputs with the same evidence contract used by the AI Evaluation and RAG Platform.
  shared_assets:
    - blinded experiment contract
    - deterministic answer metrics
    - portfolio-compatible benchmark result
status: published
claim: Local-first evaluator for supplied blinded prompt outputs with deterministic metrics, exhaustive small-sample bootstrap, and paired uncertainty.
stack:
  - python
  - bootstrap-statistics
  - jsonl
  - unittest
  - docker
language_profile:
  primary: python
  secondary: []
  reason: Deterministic scoring and experiment validation are packaged as testable Python functions with a CLI.
decision_brain:
  agent_graph:
    mode: principal-agent-orchestrated
    source: .portfolio/decision-brain/agent-graph.yaml
    handoff: sdd/agent-handoff.md
    local_first_runtime: docker
  reuse_improvement_loop:
    source: .portfolio/decision-brain/reuse-improvement-loop.yaml
    review_path: sdd/reuse-improvement-review.md
    current_status: backlog_recorded
  principles:
    coupling_rule: Scoring consumes provider-neutral cases and blinded outputs and never imports a prompt runner.
    solid: [srp, ocp, lsp, isp, dip]
    simplicity_rule: Use deterministic task metrics and paired bootstrap; never use fixture multipliers or semantic variant labels.
    testability_rule: Tests replace supplied outputs and prove that the result changes from evidence.
  stack_profile: python
  api_style: cli-first
  messaging: none
  cloud:
    mode: none
    local_provider: kumo
    real_provider_target: none
    adapter_rule: Prompt runners produce the output contract and remain outside the evaluator.
  database: fixture-files
  runtime: python-cli
  library_policy: Use standard-library metrics and bootstrap for the local benchmark; provider SDKs belong in output producers.
  record_path: sdd/technical-decision.md
architecture:
  style: functional-core-imperative-shell
  reason: Validation, scoring, and paired uncertainty are pure policies around file-based experiment adapters.
  dependency_rule: The evaluator never generates prompts or imports provider, cloud, transport, or billing SDKs.
design_system:
  tokens: .portfolio/design-system/tokens.yaml
  readme_components: [readme_header, benchmark_card, architecture_card, references_table]
  diagram_required: true
reuse:
  kit_version: local
  uses: [catalog, programs, decision-brain, reuse-improvement-loop, architecture, language-profiles, design-system, sdd, harness, templates, skills]
benchmark:
  primary_metric: highest_mean_score
  unit: ratio
  command: python -m prompt_ab_testing benchmark --cases data/fixtures/cases.jsonl --outputs data/fixtures/outputs.jsonl --variants data/fixtures/variants.json --output benchmarks/results/prompt-ab-baseline.json
  result_path: benchmarks/publication/prompt-ab-baseline-v2.json
release:
  docker: Dockerfile
  no_secret_default_path: true
  readme_has_number: true
  references_documented: true
