name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install package and validation dependencies
        run: |
          pip install -r requirements-validation.lock
          pip install --no-build-isolation --no-deps -e .
      - name: Verify publication provenance when present
        run: python tools/validate_publication.py --require-git
      - name: Validate project and tests
        shell: pwsh
        run: ./tools/validate-project.ps1 -SkipDocker
      - name: Build Docker image
        run: docker build -t prompt-ab-testing:ci .
      - name: Run benchmark in Docker
        run: docker run --rm --network none prompt-ab-testing:ci
